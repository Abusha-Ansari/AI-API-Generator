<!doctype html>
<html lang="en" class="dark">

    <meta property="og:type" content="website" />

    <meta property="og:locale" content="en_US" />

      content="Transform OpenAPI 3.x JSON or YAML specs into typed TypeScript SDKs, Markdown API docs, unit tests, Postman collections, and cURL examples via streaming AI."

    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">

        "featureList": [
          "OpenAPI 3.0 and 3.1 JSON and YAML validation with swagger-parser",
          "TypeScript SDK generation (fetch or axios)",
          "Markdown API reference documentation",
          "Vitest and Jest mocked unit test suites",
          "Postman Collection v2.1.0 JSON export",
          "cURL and JavaScript fetch request examples",
          "Bring Your Own Key (BYOK) multi-provider support for Gemini, OpenAI, and Anthropic"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }

    <link rel="preconnect" href="https://fonts.googleapis.com" />
